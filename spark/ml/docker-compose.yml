# ML / Spark environment for the fare-prediction workflow.
#
# Usage (from spark/ml/):
#   docker compose build                                   # build the image
#   docker compose run --rm ml python 00_prep_spark.py --limit-files 3   # batch script
#   docker compose up                                      # JupyterLab at http://localhost:8888
#
# The whole repo is bind-mounted at /workspace, so the container sees
# migration_backup/ (input) and spark/ml/data/ (output) with no copying.
services:
  ml:
    build:
      context: .
      dockerfile: Dockerfile
    image: nyc-taxi-ml:latest
    working_dir: /workspace
    volumes:
      - ../../:/workspace          # repo root -> /workspace
    environment:
      - PYTHONPATH=/workspace
      - SPARK_LOCAL_DIRS=/tmp/spark   # keep Spark shuffle spill inside the container
    ports:
      - "8888:8888"                # JupyterLab
    shm_size: "2gb"                # headroom for Spark local shuffle
    # `docker compose up` -> JupyterLab; `docker compose run --rm ml <cmd>` -> one-off scripts
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
      --allow-root --ServerApp.token='' --ServerApp.root_dir=/workspace
