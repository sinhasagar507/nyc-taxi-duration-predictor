[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --color=yes
markers =
    integration: requires GOOGLE_APPLICATION_CREDENTIALS; auto-skipped if credentials file absent
    e2e: requires running Airflow stack (docker compose up)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
